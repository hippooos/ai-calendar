services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_calendar
      POSTGRES_USER: ai_calendar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_calendar -d ai_calendar"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_MODE: deployed
      APP_ACCESS_CODE: ${APP_ACCESS_CODE}
      DATABASE_URL: postgresql+psycopg://ai_calendar:${POSTGRES_PASSWORD}@db:5432/ai_calendar
      LLM_BASE_URL: ${LLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-glm-5.2}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Shanghai}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

